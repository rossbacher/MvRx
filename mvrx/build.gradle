import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "kotlin-parcelize"
apply from: '../publishing.gradle'

tasks.withType(KotlinCompile).all {
    kotlinOptions {
        freeCompilerArgs += [
                '-opt-in=kotlin.RequiresOptIn',
                '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
                '-opt-in=com.airbnb.mvrx.InternalMavericksApi',
                '-opt-in=com.airbnb.mvrx.ExperimentalMavericksApi',
        ]
    }
}

android {
    resourcePrefix "mvrx_"

    defaultConfig {
        consumerProguardFiles "proguard-rules.pro", "proguard-persist-state-rules.pro"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // MinifiedConsumerRulesTest shrinks Mavericks with R8 and these consumer rules.
                systemProperty "mavericks.consumerRules", file("proguard-rules.pro").absolutePath
                systemProperty "mavericks.persistStateConsumerRules", file("proguard-persist-state-rules.pro").absolutePath
                systemProperty "mavericks.androidJar", android.bootClasspath.join(File.pathSeparator)
                jacoco {
                    includeNoLocationClasses = true
                    jacoco.excludes = ['jdk.internal.*']
                }
            }
        }
    }
    namespace 'com.airbnb.mvrx'
}

dependencies {
    api project(':mvrx-common')
    api libs.kotlinCoroutines
    api libs.activity

    implementation libs.activity
    implementation libs.appcompat
    implementation libs.fragment
    implementation libs.viewModelSavedState
    implementation libs.lifecycleCommon
    implementation libs.viewModelKtx
    implementation libs.runtimeKtx

    testImplementation libs.junit
    testImplementation libs.kotlinCoroutinesTest
    testImplementation libs.mockito
    testImplementation libs.roboeletric
    testImplementation libs.lifecycleTest
    testImplementation libs.r8
}
